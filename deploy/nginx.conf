upstream societyhub_backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 105m;

    location /api/ {
        proxy_pass http://societyhub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://societyhub_backend/actuator/health;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://societyhub_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/ {
        proxy_pass http://societyhub_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /super-admin { return 301 /super-admin/; }
    location /super-admin/ {
        try_files $uri $uri/ /super-admin/index.html;
    }

    location = /society-admin { return 301 /society-admin/; }
    location /society-admin/ {
        try_files $uri $uri/ /society-admin/index.html;
    }

    location = /staff { return 301 /staff/; }
    location /staff/ {
        try_files $uri $uri/ /staff/index.html;
    }

    location = /member { return 301 /member/; }
    location /member/ {
        try_files $uri $uri/ /member/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
