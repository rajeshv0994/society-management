name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.9

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Format, unit, and architecture tests
        run: mvn --batch-mode --no-transfer-progress spotless:check test
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 14

  flutter-quality:
    name: Flutter quality (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shared-package
            path: packages/society_ui
          - name: public-frontend
            path: frontend
          - name: super-admin
            path: apps/super_admin
          - name: society-admin
            path: apps/society_admin
          - name: staff
            path: apps/staff
          - name: member
            path: apps/member
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded

  web-build:
    name: Web build (${{ matrix.name }})
    needs: flutter-quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: public-frontend
            path: frontend
          - name: super-admin
            path: apps/super_admin
          - name: society-admin
            path: apps/society_admin
          - name: staff
            path: apps/staff
          - name: member
            path: apps/member
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: ${{ matrix.path }}
        run: flutter pub get
      - name: Build release bundle
        working-directory: ${{ matrix.path }}
        run: >-
          flutter build web --release
          --dart-define=API_BASE_URL=http://localhost:8080
      - uses: actions/upload-artifact@v7
        with:
          name: ci-web-${{ matrix.name }}
          path: ${{ matrix.path }}/build/web
          if-no-files-found: error
          retention-days: 7

  android-smoke:
    name: Society Admin Android build
    needs: flutter-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: apps/society_admin
        run: flutter pub get
      - name: Build debug APK with native Razorpay adapter
        working-directory: apps/society_admin
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: society-admin-debug-apk
          path: apps/society_admin/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  complete-flow:
    name: Fresh-database cross-role E2E
    needs: [backend, flutter-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Run complete application flow
        run: scripts/run_complete_app_e2e.sh
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: complete-app-flow-report
          path: build/reports/complete_app_flow_smoke.json
          if-no-files-found: ignore
          retention-days: 30
