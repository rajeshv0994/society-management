<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2000" viewBox="0 0 2200 2000" role="img" aria-labelledby="title desc">
  <title id="title">SocietyHub detailed configuration flowchart</title>
  <desc id="desc">Detailed Super Admin platform defaults and Society Admin setup dependencies through setup readiness and operational enablement.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#17266f"/></marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b153f" flood-opacity="0.12"/></filter>
    <style>
      .t{font:700 39px Arial,sans-serif;fill:#111a3b}.sub{font:400 19px Arial,sans-serif;fill:#66718f}.h{font:700 22px Arial,sans-serif;fill:#17266f;letter-spacing:1px}.nt{font:700 18px Arial,sans-serif;fill:#111a3b;text-anchor:middle}.nc{font:400 15px Arial,sans-serif;fill:#4f5b79;text-anchor:middle}.sm{font:700 13px Arial,sans-serif;fill:#17266f;text-anchor:middle}.w{fill:#fff}.b{fill:#fff;stroke:#cfd7ea;stroke-width:2;rx:15;filter:url(#s)}.p{fill:#eef2ff;stroke:#365bd9;stroke-width:2.5;rx:15;filter:url(#s)}.o{fill:#fff8e6;stroke:#f0af24;stroke-width:2.5;rx:15;filter:url(#s)}.g{fill:#ecfbf3;stroke:#2b9a67;stroke-width:2.5;rx:15;filter:url(#s)}.r{fill:#fff0f2;stroke:#cf4560;stroke-width:2.5;rx:15;filter:url(#s)}.grp{fill:#f5f7ff;stroke:#b9c6ec;stroke-width:2;rx:24}.line{fill:none;stroke:#17266f;stroke-width:2.5;marker-end:url(#a)}.dash{fill:none;stroke:#17266f;stroke-width:2.3;stroke-dasharray:8 7;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="2200" height="2000" fill="#fbfaf7"/>
  <text x="1100" y="58" class="t" text-anchor="middle">SocietyHub — Detailed Configuration Flow</text>
  <text x="1100" y="92" class="sub" text-anchor="middle">Platform defaults → society subscription → master data → operational rules → readiness and governance</text>

  <rect x="975" y="125" width="250" height="66" rx="33" fill="#101b68" filter="url(#s)"/><text x="1100" y="167" class="nt w">START</text>
  <path d="M1100 191 V225" class="line"/>

  <text x="65" y="225" class="h">A  PLATFORM CONFIGURATION — SUPER ADMIN</text>
  <rect x="55" y="245" width="2090" height="290" class="grp"/>
  <rect x="95" y="305" width="365" height="145" class="o"/>
  <text x="277" y="340" class="nt">Services &amp; rates</text><text x="277" y="369" class="nc">Default-free • optional-free • paid</text><text x="277" y="394" class="nc">Usage rates or fixed custom base</text><text x="277" y="419" class="nc">Capacity limits and billing cycles</text>
  <path d="M460 377 H520" class="line"/>
  <rect x="520" y="305" width="365" height="145" class="o"/>
  <text x="702" y="340" class="nt">Approval &amp; access</text><text x="702" y="369" class="nc">Automatic or manual approval</text><text x="702" y="394" class="nc">Trial expiry and due-invoice gate</text><text x="702" y="419" class="nc">Setup-code activation</text>
  <path d="M885 377 H945" class="line"/>
  <rect x="945" y="305" width="365" height="145" class="o"/>
  <text x="1127" y="340" class="nt">Storage policy</text><text x="1127" y="369" class="nc">Default free allowance</text><text x="1127" y="394" class="nc">Paid block size and monthly price</text><text x="1127" y="419" class="nc">Per-society usage monitoring</text>
  <path d="M1310 377 H1370" class="line"/>
  <rect x="1370" y="305" width="365" height="145" class="o"/>
  <text x="1552" y="340" class="nt">Platform payments</text><text x="1552" y="369" class="nc">Razorpay settings and orders</text><text x="1552" y="394" class="nc">Capture, webhook, reconciliation</text><text x="1552" y="419" class="nc">Invoice PDF, attempts, safe cancel</text>
  <path d="M1735 377 H1795" class="line"/>
  <rect x="1795" y="305" width="310" height="145" class="p"/>
  <text x="1950" y="340" class="nt">Tenant baseline</text><text x="1950" y="369" class="nc">Approved services</text><text x="1950" y="394" class="nc">Purchased capacity</text><text x="1950" y="419" class="nc">Membership entitlement</text>
  <path d="M1950 450 V565 H1100" class="line"/>

  <text x="65" y="575" class="h">B  SOCIETY SETUP — SOCIETY ADMIN</text>
  <rect x="55" y="595" width="2090" height="1000" class="grp"/>
  <rect x="885" y="625" width="430" height="90" class="p"/>
  <text x="1100" y="659" class="nt">Authenticate and load tenant context</text><text x="1100" y="687" class="nc">Own society ID • enabled services • purchased limits</text>
  <path d="M1100 715 V750" class="line"/>
  <rect x="130" y="750" width="380" height="120" class="p"/>
  <text x="320" y="785" class="nt">1. Society profile</text><text x="320" y="813" class="nc">Name • contacts • address • timezone</text><text x="320" y="838" class="nc">Registration details • logo</text>
  <path d="M510 810 H575" class="line"/>
  <rect x="575" y="750" width="430" height="120" class="p"/>
  <text x="790" y="785" class="nt">2. Subscription configuration</text><text x="790" y="813" class="nc">Spaces • staff • services • fixed custom</text><text x="790" y="838" class="nc">Cycle cost and payment recovery</text>
  <path d="M1005 810 H1070" class="line"/>
  <polygon points="1260,738 1450,810 1260,882 1070,810" fill="#fff" stroke="#e16e52" stroke-width="3" filter="url(#s)"/>
  <text x="1260" y="802" class="nt">Within purchased limits?</text><text x="1260" y="829" class="nc">Configured usage validation</text>
  <path d="M1450 810 H1515" class="line"/><text x="1480" y="792" class="sm">YES</text>
  <rect x="1515" y="750" width="420" height="120" class="p"/>
  <text x="1725" y="785" class="nt">3. Property structure</text><text x="1725" y="813" class="nc">Property groups/blocks → optional sections</text><text x="1725" y="838" class="nc">Spaces • type • area • occupancy state</text>
  <path d="M1260 738 V705 H790 V750" class="dash"/><text x="1300" y="720" class="sm">NO — ADJUST</text>

  <path d="M1725 870 V930 H1830" class="line"/>
  <rect x="1630" y="930" width="400" height="120" class="p"/>
  <text x="1830" y="965" class="nt">4. Resident &amp; household</text><text x="1830" y="993" class="nc">Owner/tenant registration review</text><text x="1830" y="1018" class="nc">Space occupancy • members • vehicles</text>
  <path d="M1630 990 H1565" class="line"/>
  <rect x="1135" y="930" width="430" height="120" class="p"/>
  <text x="1350" y="965" class="nt">5. Staff &amp; permissions</text><text x="1350" y="993" class="nc">Accounts • shifts • duty area • status</text><text x="1350" y="1018" class="nc">Permissions ≤ enabled society modules</text>
  <path d="M1135 990 H1070" class="line"/>
  <rect x="640" y="930" width="430" height="120" class="p"/>
  <text x="855" y="965" class="nt">6. Finance configuration</text><text x="855" y="993" class="nc">Maintenance charge rules and frequency</text><text x="855" y="1018" class="nc">Society payment account/settings</text>
  <path d="M640 990 H575" class="line"/>
  <rect x="145" y="930" width="430" height="120" class="p"/>
  <text x="360" y="965" class="nt">7. Operations configuration</text><text x="360" y="993" class="nc">Parking • vendors • complaint categories</text><text x="360" y="1018" class="nc">SLA values • emergency directory</text>

  <path d="M360 1050 V1110 H555" class="line"/>
  <rect x="145" y="1110" width="820" height="125" class="o"/>
  <text x="555" y="1143" class="nt">8. Storage &amp; document readiness</text><text x="555" y="1171" class="nc">Review free, purchased, used and available bytes • purchase recurring blocks if required</text><text x="555" y="1196" class="nc">Upload society logo/documents • existing files reconciled • unsafe legacy deletion stays locked</text>
  <path d="M965 1172 H1030" class="line"/>
  <rect x="1030" y="1110" width="1025" height="125" class="o"/>
  <text x="1542" y="1143" class="nt">9. Module entitlement verification</text><text x="1542" y="1171" class="nc">Navigation is built from selected services • protected APIs reject disabled modules</text><text x="1542" y="1196" class="nc">Staff gets only assigned permissions • residents get owned or published society records</text>

  <path d="M1542 1235 V1280 H1100" class="line"/>
  <polygon points="1100,1265 1300,1350 1100,1435 900,1350" fill="#fff" stroke="#e16e52" stroke-width="3" filter="url(#s)"/>
  <text x="1100" y="1341" class="nt">Setup readiness complete?</text><text x="1100" y="1368" class="nc">Required checklist and dependencies</text>
  <path d="M900 1350 H620 V1450" class="dash"/><text x="760" y="1332" class="sm">NO</text>
  <rect x="400" y="1450" width="440" height="100" class="r"/>
  <text x="620" y="1484" class="nt">Show missing setup items</text><text x="620" y="1512" class="nc">Return to the required configuration section</text>
  <path d="M620 1450 V1395 H205 V810 H130" class="dash"/>
  <path d="M1300 1350 H1580 V1450" class="line"/><text x="1438" y="1332" class="sm">YES</text>
  <rect x="1360" y="1450" width="440" height="100" class="g"/>
  <text x="1580" y="1484" class="nt">Confirm setup completion</text><text x="1580" y="1512" class="nc">Society is ready for enabled operations</text>

  <path d="M1580 1550 V1635 H1100" class="line"/>
  <text x="65" y="1640" class="h">C  GOVERNANCE &amp; OPERATION</text>
  <rect x="140" y="1660" width="500" height="140" class="g"/>
  <text x="390" y="1696" class="nt">Operational workspace</text><text x="390" y="1724" class="nc">People • billing • visitors • complaints</text><text x="390" y="1749" class="nc">Amenities • activities • deliveries</text><text x="390" y="1774" class="nc">Notices • emergency • support</text>
  <path d="M1100 1635 V1660 H640" class="line"/>
  <rect x="850" y="1660" width="500" height="140" class="p"/>
  <text x="1100" y="1696" class="nt">Security &amp; tenant controls</text><text x="1100" y="1724" class="nc">JWT • role • society • ownership</text><text x="1100" y="1749" class="nc">Service entitlement • staff permission</text><text x="1100" y="1774" class="nc">Transactional lifecycle validation</text>
  <path d="M640 1730 H850" class="line"/>
  <path d="M1350 1730 H1560" class="line"/>
  <rect x="1560" y="1660" width="500" height="140" class="p"/>
  <text x="1810" y="1696" class="nt">Audit &amp; monitoring</text><text x="1810" y="1724" class="nc">Successful mutations record performer</text><text x="1810" y="1749" class="nc">Society sensitive activity is tenant-scoped</text><text x="1810" y="1774" class="nc">Super Admin gets platform-wide audit</text>
  <path d="M1810 1800 V1850 H1100" class="line"/>
  <rect x="960" y="1850" width="280" height="70" rx="35" fill="#101b68" filter="url(#s)"/><text x="1100" y="1893" class="nt w">READY / END</text>
</svg>
