<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2600" viewBox="0 0 2400 2600" role="img" aria-labelledby="title desc">
  <title id="title">SocietyHub complete application and configuration flowchart</title>
  <desc id="desc">End-to-end flow from public onboarding and login through role workspaces, society configuration, operations, storage quota, billing, audit, notifications, and completion.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#17266f"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b153f" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #111a3b; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #66718f; }
      .stage { font: 700 22px Arial, sans-serif; fill: #17266f; letter-spacing: 1.4px; }
      .node-title { font: 700 18px Arial, sans-serif; fill: #111a3b; text-anchor: middle; }
      .node-copy { font: 400 15px Arial, sans-serif; fill: #4f5b79; text-anchor: middle; }
      .small { font: 600 13px Arial, sans-serif; fill: #17266f; text-anchor: middle; }
      .white { fill: #fff; }
      .box { fill: #fff; stroke: #cfd7ea; stroke-width: 2; rx: 15; filter: url(#shadow); }
      .primary { fill: #eef2ff; stroke: #365bd9; stroke-width: 2.5; rx: 15; filter: url(#shadow); }
      .accent { fill: #fff8e6; stroke: #f0af24; stroke-width: 2.5; rx: 15; filter: url(#shadow); }
      .success { fill: #ecfbf3; stroke: #2b9a67; stroke-width: 2.5; rx: 15; filter: url(#shadow); }
      .danger { fill: #fff0f2; stroke: #cf4560; stroke-width: 2.5; rx: 15; filter: url(#shadow); }
      .group { fill: #f8f9fd; stroke: #d9dfef; stroke-width: 2; rx: 24; }
      .group-blue { fill: #f1f4ff; stroke: #aab9ed; stroke-width: 2; rx: 24; }
      .flow { fill: none; stroke: #17266f; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow-dash { fill: none; stroke: #17266f; stroke-width: 2.3; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .label-bg { fill: #fff; rx: 8; }
    </style>
  </defs>

  <rect width="2400" height="2600" fill="#fbfaf7"/>
  <text x="1200" y="58" class="title" text-anchor="middle">SocietyHub — Complete Application &amp; Configuration Flow</text>
  <text x="1200" y="92" class="subtitle" text-anchor="middle">Public onboarding → secured role workspaces → society setup → daily operations → storage, billing, audit and response</text>

  <!-- Start -->
  <rect x="1075" y="125" width="250" height="68" rx="34" fill="#101b68" filter="url(#shadow)"/>
  <text x="1200" y="168" class="node-title white">START</text>
  <path d="M1200 193 V236" class="flow"/>

  <!-- Stage 1 -->
  <text x="90" y="235" class="stage">1  ENTRY &amp; ONBOARDING</text>
  <polygon points="1200,230 1360,310 1200,390 1040,310" fill="#fff" stroke="#e16e52" stroke-width="3" filter="url(#shadow)"/>
  <text x="1200" y="303" class="node-title">New society?</text>
  <text x="1200" y="328" class="node-copy">Choose entry path</text>

  <!-- New society branch -->
  <path d="M1040 310 H790" class="flow"/>
  <rect x="850" y="280" width="70" height="25" class="label-bg"/>
  <text x="885" y="298" class="small">YES</text>
  <rect x="410" y="255" width="380" height="110" class="primary"/>
  <text x="600" y="288" class="node-title">Discover &amp; register</text>
  <text x="600" y="316" class="node-copy">Services • spaces • staff • billing cycle</text>
  <text x="600" y="340" class="node-copy">Free/default modules • paid add-ons</text>
  <path d="M600 365 V415" class="flow"/>
  <polygon points="600,405 750,475 600,545 450,475" fill="#fff" stroke="#e16e52" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="469" class="node-title">Approval required?</text>
  <text x="600" y="495" class="node-copy">Plan approval mode</text>
  <path d="M450 475 H245 V590" class="flow"/>
  <text x="340" y="459" class="small">YES</text>
  <rect x="75" y="590" width="340" height="100" class="accent"/>
  <text x="245" y="625" class="node-title">Super Admin review</text>
  <text x="245" y="652" class="node-copy">Approve or reject registration</text>
  <path d="M750 475 H920 V590" class="flow"/>
  <text x="830" y="459" class="small">NO</text>
  <rect x="750" y="590" width="340" height="100" class="success"/>
  <text x="920" y="625" class="node-title">Automatic approval</text>
  <text x="920" y="652" class="node-copy">Trial or pending-payment workflow</text>
  <path d="M415 640 H535 V730" class="flow"/>
  <path d="M750 640 H665 V730" class="flow"/>
  <rect x="410" y="730" width="380" height="105" class="primary"/>
  <text x="600" y="765" class="node-title">Activate Society Admin</text>
  <text x="600" y="792" class="node-copy">Expiring setup code → set password</text>
  <text x="600" y="816" class="node-copy">Trial access or payment-only recovery</text>

  <!-- Existing branch -->
  <path d="M1360 310 H1610" class="flow"/>
  <rect x="1480" y="280" width="65" height="25" class="label-bg"/>
  <text x="1512" y="298" class="small">NO</text>
  <rect x="1610" y="255" width="410" height="110" class="primary"/>
  <text x="1815" y="288" class="node-title">Role-specific login</text>
  <text x="1815" y="316" class="node-copy">Super Admin • Society Admin</text>
  <text x="1815" y="340" class="node-copy">Staff • Resident</text>
  <path d="M1815 365 V415" class="flow"/>
  <polygon points="1815,405 1980,475 1815,545 1650,475" fill="#fff" stroke="#e16e52" stroke-width="3" filter="url(#shadow)"/>
  <text x="1815" y="464" class="node-title">Authentication valid?</text>
  <text x="1815" y="490" class="node-copy">Password, role, status, expiry</text>
  <path d="M1980 475 H2155 V575" class="flow"/>
  <text x="2060" y="459" class="small">NO</text>
  <rect x="2015" y="575" width="280" height="100" class="danger"/>
  <text x="2155" y="610" class="node-title">Access denied</text>
  <text x="2155" y="638" class="node-copy">No business mutation</text>
  <path d="M1815 545 V730" class="flow"/>
  <text x="1850" y="575" class="small">YES</text>
  <rect x="1635" y="730" width="360" height="105" class="success"/>
  <text x="1815" y="765" class="node-title">Secure session</text>
  <text x="1815" y="792" class="node-copy">JWT access token + rotating refresh</text>
  <text x="1815" y="816" class="node-copy">Role and society context established</text>

  <!-- Stage 2 -->
  <text x="90" y="900" class="stage">2  ROLE ROUTING</text>
  <path d="M600 835 V890 H1200" class="flow"/>
  <path d="M1815 835 V890 H1200" class="flow"/>
  <polygon points="1200,870 1370,950 1200,1030 1030,950" fill="#fff" stroke="#e16e52" stroke-width="3" filter="url(#shadow)"/>
  <text x="1200" y="943" class="node-title">Which role?</text>
  <text x="1200" y="969" class="node-copy">Authorized workspace</text>

  <path d="M1030 950 H340 V1070" class="flow"/>
  <path d="M1120 1010 L900 1070" class="flow"/>
  <path d="M1280 1010 L1500 1070" class="flow"/>
  <path d="M1370 950 H2060 V1070" class="flow"/>

  <rect x="90" y="1070" width="500" height="170" class="accent"/>
  <text x="340" y="1107" class="node-title">SUPER ADMIN</text>
  <text x="340" y="1137" class="node-copy">Societies • approvals • services • rates</text>
  <text x="340" y="1162" class="node-copy">Requirements • platform billing • support</text>
  <text x="340" y="1187" class="node-copy">Storage policy &amp; usage • audit log</text>
  <text x="340" y="1212" class="node-copy">Notification outbox</text>

  <rect x="650" y="1070" width="500" height="170" class="primary"/>
  <text x="900" y="1107" class="node-title">SOCIETY ADMIN</text>
  <text x="900" y="1137" class="node-copy">Own society setup and configuration</text>
  <text x="900" y="1162" class="node-copy">People • finance • operations • storage</text>
  <text x="900" y="1187" class="node-copy">Support • sensitive activity</text>
  <text x="900" y="1212" class="node-copy">All enabled society modules</text>

  <rect x="1250" y="1070" width="500" height="170" class="box"/>
  <text x="1500" y="1107" class="node-title">STAFF</text>
  <text x="1500" y="1137" class="node-copy">Own society + assigned permissions</text>
  <text x="1500" y="1162" class="node-copy">Tasks • visitors • complaints • payments</text>
  <text x="1500" y="1187" class="node-copy">Activities • deliveries • emergencies</text>
  <text x="1500" y="1212" class="node-copy">Attendance and operational duties</text>

  <rect x="1810" y="1070" width="500" height="170" class="box"/>
  <text x="2060" y="1107" class="node-title">RESIDENT / MEMBER</text>
  <text x="2060" y="1137" class="node-copy">Own profile, household and space</text>
  <text x="2060" y="1162" class="node-copy">Invoices • complaints • visitors • bookings</text>
  <text x="2060" y="1187" class="node-copy">Activities • deliveries • notices</text>
  <text x="2060" y="1212" class="node-copy">Emergency reporting</text>

  <!-- Stage 3 configuration -->
  <text x="90" y="1318" class="stage">3  SOCIETY CONFIGURATION</text>
  <rect x="70" y="1340" width="2260" height="480" class="group-blue"/>
  <text x="1200" y="1378" class="node-title">Society Admin Setup Dependency Flow</text>
  <text x="1200" y="1405" class="node-copy">Required setup is completed in sequence; operational modules follow purchased service entitlements</text>

  <path d="M900 1240 V1450 H235" class="flow"/>
  <rect x="100" y="1450" width="270" height="110" class="primary"/>
  <text x="235" y="1483" class="node-title">1. Profile</text>
  <text x="235" y="1510" class="node-copy">Identity • contacts • address</text>
  <text x="235" y="1534" class="node-copy">Logo and society details</text>

  <path d="M370 1505 H430" class="flow"/>
  <rect x="430" y="1450" width="300" height="110" class="primary"/>
  <text x="580" y="1483" class="node-title">2. Subscription</text>
  <text x="580" y="1510" class="node-copy">Usage or fixed custom pricing</text>
  <text x="580" y="1534" class="node-copy">Cycle, invoice, Razorpay, access gate</text>

  <path d="M730 1505 H790" class="flow"/>
  <rect x="790" y="1450" width="300" height="110" class="primary"/>
  <text x="940" y="1483" class="node-title">3. Property</text>
  <text x="940" y="1510" class="node-copy">Groups/blocks → sections</text>
  <text x="940" y="1534" class="node-copy">Spaces, area and occupancy</text>

  <path d="M1090 1505 H1150" class="flow"/>
  <rect x="1150" y="1450" width="300" height="110" class="primary"/>
  <text x="1300" y="1483" class="node-title">4. People</text>
  <text x="1300" y="1510" class="node-copy">Resident review • households</text>
  <text x="1300" y="1534" class="node-copy">Staff, shifts and permissions</text>

  <path d="M1450 1505 H1510" class="flow"/>
  <rect x="1510" y="1450" width="360" height="110" class="primary"/>
  <text x="1690" y="1483" class="node-title">5. Rules &amp; Accounts</text>
  <text x="1690" y="1510" class="node-copy">Parking • vendors • complaint SLAs</text>
  <text x="1690" y="1534" class="node-copy">Charge rules • payment settings</text>

  <path d="M1870 1505 H1930" class="flow"/>
  <polygon points="2090,1435 2250,1505 2090,1575 1930,1505" fill="#fff" stroke="#e16e52" stroke-width="3" filter="url(#shadow)"/>
  <text x="2090" y="1497" class="node-title">Setup ready?</text>
  <text x="2090" y="1523" class="node-copy">Required checks pass</text>

  <path d="M2090 1575 V1625 H1690" class="flow"/>
  <text x="2130" y="1605" class="small">YES</text>
  <rect x="1510" y="1625" width="360" height="115" class="success"/>
  <text x="1690" y="1658" class="node-title">Enable operations</text>
  <text x="1690" y="1686" class="node-copy">Only purchased/enabled modules</text>
  <text x="1690" y="1711" class="node-copy">Navigation + API entitlements</text>
  <path d="M2250 1505 H2290 V1680 H1870" class="flow-dash"/>
  <text x="2275" y="1490" class="small">NO</text>

  <rect x="100" y="1625" width="1250" height="115" class="accent"/>
  <text x="725" y="1658" class="node-title">Configuration controls</text>
  <text x="725" y="1686" class="node-copy">Service entitlements control navigation and protected APIs • staff permissions cannot exceed enabled modules</text>
  <text x="725" y="1711" class="node-copy">Capacity cannot drop below configured spaces or active staff • tenant identifiers come from authenticated context</text>

  <!-- Stage 4 operations -->
  <text x="90" y="1885" class="stage">4  OPERATIONS &amp; REQUEST PROCESSING</text>
  <path d="M1690 1740 V1905 H1200" class="flow"/>
  <path d="M340 1240 V1855 H1200 V1905" class="flow-dash"/>
  <path d="M1500 1240 V1855 H1200" class="flow-dash"/>
  <path d="M2060 1240 V1855 H1200" class="flow-dash"/>

  <rect x="90" y="1910" width="2220" height="155" class="group"/>
  <text x="1200" y="1943" class="node-title">Enabled Operational Modules</text>
  <text x="1200" y="1973" class="node-copy">Billing &amp; payments  •  complaints &amp; tasks  •  visitors  •  notices &amp; documents  •  amenities &amp; bookings</text>
  <text x="1200" y="2002" class="node-copy">Activities &amp; galleries  •  deliveries &amp; COD  •  emergencies &amp; accidents  •  support tickets</text>
  <text x="1200" y="2031" class="node-copy">Every list and mutation is filtered by role, society, ownership, service entitlement and staff permission</text>

  <path d="M1200 2065 V2105" class="flow"/>
  <rect x="950" y="2105" width="500" height="95" class="primary"/>
  <text x="1200" y="2140" class="node-title">Secured API request</text>
  <text x="1200" y="2168" class="node-copy">Validate DTO → authorization → business lifecycle</text>
  <path d="M1200 2200 V2245" class="flow"/>
  <polygon points="1200,2230 1370,2310 1200,2390 1030,2310" fill="#fff" stroke="#e16e52" stroke-width="3" filter="url(#shadow)"/>
  <text x="1200" y="2302" class="node-title">File involved?</text>
  <text x="1200" y="2328" class="node-copy">Photo, video or document</text>

  <!-- non-file path -->
  <path d="M1030 2310 H720" class="flow"/>
  <text x="865" y="2293" class="small">NO</text>
  <rect x="390" y="2258" width="330" height="105" class="box"/>
  <text x="555" y="2293" class="node-title">Database transaction</text>
  <text x="555" y="2321" class="node-copy">Validate and persist scoped state</text>
  <text x="555" y="2345" class="node-copy">Generate billing line if applicable</text>

  <!-- file path -->
  <path d="M1370 2310 H1585" class="flow"/>
  <text x="1475" y="2293" class="small">YES</text>
  <polygon points="1750,2238 1915,2310 1750,2382 1585,2310" fill="#fff" stroke="#e16e52" stroke-width="3" filter="url(#shadow)"/>
  <text x="1750" y="2302" class="node-title">Within quota?</text>
  <text x="1750" y="2328" class="node-copy">Free + purchased bytes</text>
  <path d="M1915 2310 H2170 V2205" class="flow"/>
  <text x="2040" y="2293" class="small">NO</text>
  <rect x="1995" y="2105" width="350" height="100" class="accent"/>
  <text x="2170" y="2140" class="node-title">Capacity action</text>
  <text x="2170" y="2168" class="node-copy">Purchase blocks or clean safe files</text>
  <path d="M2170 2105 V2078 H1750 V2238" class="flow-dash"/>
  <path d="M1750 2382 V2430 H720" class="flow"/>
  <text x="1790" y="2413" class="small">YES</text>
  <rect x="390" y="2430" width="330" height="100" class="success"/>
  <text x="555" y="2463" class="node-title">Persist safely</text>
  <text x="555" y="2490" class="node-copy">DB metadata + metered file bytes</text>
  <text x="555" y="2513" class="node-copy">Or recurring STORAGE_ADDON invoice</text>

  <path d="M555 2363 V2430" class="flow"/>
  <path d="M720 2480 H980" class="flow"/>
  <rect x="980" y="2430" width="440" height="100" class="primary"/>
  <text x="1200" y="2463" class="node-title">Immutable audit event</text>
  <text x="1200" y="2490" class="node-copy">Who • action • target • society • timestamp</text>
  <text x="1200" y="2513" class="node-copy">Safe structured details for sensitive review</text>
  <path d="M1420 2480 H1600" class="flow"/>
  <rect x="1600" y="2430" width="390" height="100" class="box"/>
  <text x="1795" y="2463" class="node-title">Notify &amp; respond</text>
  <text x="1795" y="2490" class="node-copy">Outbox event when applicable</text>
  <text x="1795" y="2513" class="node-copy">Return role-scoped result</text>
  <path d="M1990 2480 H2110" class="flow"/>
  <rect x="2110" y="2445" width="210" height="70" rx="35" fill="#101b68" filter="url(#shadow)"/>
  <text x="2215" y="2488" class="node-title white">END</text>
</svg>
